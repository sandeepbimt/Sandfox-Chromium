version: 2.1

jobs:
  c4-afterbird-buildbuddy-remote:
    machine:
      image: ubuntu-2404:current
    resource_class: large
    steps:
      - checkout

      - run:
          name: Measure build VM
          command: |
            set -eux
            echo "=== BUILD VM: DISK ==="
            df -hT
            echo "=== BUILD VM: RAM ==="
            free -h
            echo "=== BUILD VM: CPU ==="
            nproc
            uname -a

      - run:
          name: Install depot_tools
          command: |
            set -eux
            git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$HOME/depot_tools"
            "$HOME/depot_tools/ensure_bootstrap"
            echo 'export PATH="$HOME/depot_tools:$PATH"' >> "$BASH_ENV"

      - run:
          name: Checkout pinned Chromium source
          command: |
            set -eux
            export PATH="$HOME/depot_tools:$PATH"

            CHROMIUM_TAG="151.0.7922.38"
            CHROMIUM_URL="https://chromium.googlesource.com/chromium/src.git"
            WORKDIR="$HOME/afterbird-chromium"
            SRC_DIR="$WORKDIR/src"

            mkdir -p "$SRC_DIR"
            git -C "$SRC_DIR" init
            git -C "$SRC_DIR" remote add origin "$CHROMIUM_URL"

            git -C "$SRC_DIR" \
              -c protocol.version=2 \
              -c http.lowSpeedLimit=0 \
              -c http.lowSpeedTime=300 \
              fetch --no-tags --depth=1 origin \
              "+refs/tags/$CHROMIUM_TAG:refs/tags/$CHROMIUM_TAG"

            git -C "$SRC_DIR" checkout --force --detach "$CHROMIUM_TAG"
            git -C "$SRC_DIR" describe --tags --exact-match

      - run:
          name: Prepare Chromium Android dependency sync
          command: |
            set -eux
            export PATH="$HOME/depot_tools:$PATH"
            WORKDIR="$HOME/afterbird-chromium"

            printf '%s\n' \
              'solutions = [' \
              '  {' \
              '    "name": "src",' \
              '    "url": "https://chromium.googlesource.com/chromium/src.git",' \
              '    "managed": False,' \
              '    "custom_deps": {},' \
              '    "custom_vars": {},' \
              '  },' \
              ']' \
              'target_os = ["android"]' > "$WORKDIR/.gclient"

            cat "$WORKDIR/.gclient"

      - run:
          name: Sync Chromium Android dependencies
          command: |
            set -eux
            export PATH="$HOME/depot_tools:$PATH"
            export DEPOT_TOOLS_UPDATE=0
            cd "$HOME/afterbird-chromium"
            gclient sync -D --no-history --nohooks

      - run:
          name: Fetch pinned Afterbird delta
          command: |
            set -eux
            AFTERBIRD_DIR="$HOME/afterbird-delta"
            AFTERBIRD_URL="https://github.com/danosito/afterbird.git"
            AFTERBIRD_SHA="5ff224f9ef8f8a0792abd2babc9f7164e8dcdb3e"

            mkdir -p "$AFTERBIRD_DIR"
            git -C "$AFTERBIRD_DIR" init
            git -C "$AFTERBIRD_DIR" remote add origin "$AFTERBIRD_URL"
            git -C "$AFTERBIRD_DIR" fetch --depth=1 origin "$AFTERBIRD_SHA"
            git -C "$AFTERBIRD_DIR" sparse-checkout init --no-cone
            git -C "$AFTERBIRD_DIR" sparse-checkout set \
              'patches/m151/*.patch' \
              'chrome/android/java/res_chromium_base/**' \
              '.build/args/release.gn'
            git -C "$AFTERBIRD_DIR" checkout --force --detach "$AFTERBIRD_SHA"

            test "$(git -C "$AFTERBIRD_DIR" rev-parse HEAD)" = "$AFTERBIRD_SHA"
            test -f "$AFTERBIRD_DIR/.build/args/release.gn"
            test -d "$AFTERBIRD_DIR/patches/m151"
            test -d "$AFTERBIRD_DIR/chrome/android/java/res_chromium_base"

            echo "=== AFTERBIRD DELTA ==="
            git -C "$AFTERBIRD_DIR" rev-parse HEAD
            du -sh "$AFTERBIRD_DIR"

      - run:
          name: Install Chromium host build dependencies
          command: |
            set -eux
            export DEBIAN_FRONTEND=noninteractive
            cd "$HOME/afterbird-chromium/src"
            ./build/install-build-deps.sh --no-chromeos-fonts

      - run:
          name: Run Chromium hooks
          command: |
            set -eux
            export PATH="$HOME/depot_tools:$PATH"
            export DEPOT_TOOLS_UPDATE=0
            cd "$HOME/afterbird-chromium"
            gclient runhooks

      - run:
          name: Apply Afterbird Chromium delta
          command: |
            set -eux
            export PATH="$HOME/depot_tools:$PATH"
            WORKDIR="$HOME/afterbird-chromium"
            SRC_DIR="$WORKDIR/src"

            cd "$SRC_DIR"
            git clean -ffd

            AFTERBIRD_DIR="$HOME/afterbird-delta"

            mkdir -p "$SRC_DIR/chrome/android/java/res_chromium_base"
            cp -a "$AFTERBIRD_DIR/chrome/android/java/res_chromium_base/." \
              "$SRC_DIR/chrome/android/java/res_chromium_base/"

            for patch in "$AFTERBIRD_DIR"/patches/m151/*.patch; do
              echo "Applying $patch"
              git apply --check "$patch"
              git apply "$patch"
            done

            git status --short

      - run:
          name: Normalize Clang crash diagnostics path for REAPI
          command: |
            set -euo pipefail
            SRC_DIR="$HOME/afterbird-chromium/src"
            FILE="$SRC_DIR/build/config/compiler/compiler.gni"
            OLD='clang_diagnostic_dir = rebase_path("//out/clang-crashreports", root_build_dir)'
            NEW='clang_diagnostic_dir = "clang-crashreports"'

            test -f "$FILE"
            COUNT="$(grep -Ec '^[[:space:]]*clang_diagnostic_dir = rebase_path\("//out/clang-crashreports", root_build_dir\)$' "$FILE" || true)"
            if [ "$COUNT" != "1" ]; then
              echo "Expected exactly one pinned Chromium clang_diagnostic_dir definition; found $COUNT"
              grep -n 'clang_diagnostic_dir' "$FILE" || true
              exit 1
            fi

            sed -i "s#clang_diagnostic_dir = rebase_path(\"//out/clang-crashreports\", root_build_dir)#clang_diagnostic_dir = \"clang-crashreports\"#" "$FILE"
            grep -Eq '^[[:space:]]*clang_diagnostic_dir = "clang-crashreports"$' "$FILE"
            if grep -Fq 'rebase_path("//out/clang-crashreports", root_build_dir)' "$FILE"; then
              echo "Unsafe parent-directory crash path remains"
              exit 1
            fi

            echo "=== TARGETED CLANG DIAGNOSTICS PATH FIX ==="
            git -C "$SRC_DIR" diff -- "$FILE"

      - run:
          name: Configure Siso BuildBuddy remote execution
          command: |
            set -euo pipefail
            export PATH="$HOME/depot_tools:$PATH"

            WORKDIR="$HOME/afterbird-chromium"
            SRC_DIR="$WORKDIR/src"
            HELPER="$WORKDIR/buildbuddy-credential-helper"

            test -n "${BUILDBUDDY_API_KEY:-}" || {
              echo "BUILDBUDDY_API_KEY is missing from CircleCI project environment variables."
              exit 1
            }

            printf '%s\n' \
              '#!/usr/bin/env python3' \
              'import json' \
              'import os' \
              'import sys' \
              '' \
              'if len(sys.argv) < 2 or sys.argv[1] != "get":' \
              '    raise SystemExit(1)' \
              '' \
              'sys.stdin.read()' \
              'key = os.environ["BUILDBUDDY_API_KEY"]' \
              'print(json.dumps({' \
              '    "headers": {' \
              '        "x-buildbuddy-api-key": [key],' \
              '    }' \
              '}))' > "$HELPER"
            chmod 700 "$HELPER"

            export SISO_REAPI_ADDRESS="${AFTERBIRD_REAPI_ADDRESS:-remote.buildbuddy.io:443}"
            export SISO_REAPI_INSTANCE="${AFTERBIRD_REAPI_INSTANCE:-default}"
            export SISO_CREDENTIAL_HELPER="$HELPER"

            python3 "$SRC_DIR/build/config/siso/configure_siso.py" \
              --reapi_instance "$SISO_REAPI_INSTANCE" \
              --reapi_address "$SISO_REAPI_ADDRESS" \
              --reapi_backend_config_path "$CIRCLE_WORKING_DIRECTORY/ci/siso/buildbuddy_backend.star" \
              --credential-helper "$HELPER"

            echo "=== SISO CONFIG ==="
            grep -E '^(SISO_REAPI_ADDRESS|SISO_REAPI_INSTANCE|SISO_CREDENTIAL_HELPER)=' \
              "$SRC_DIR/build/config/siso/.sisoenv"

            # Enable trusted remote action-cache writes so completed compile actions can be reused across clean CI jobs.
            printf '%s\n' 'ninja -re_cache_enable_write=true' > "$SRC_DIR/build/config/siso/.sisorc"
            echo "=== SISO CACHE WRITE CONFIG ==="
            cat "$SRC_DIR/build/config/siso/.sisorc"

      - run:
          name: Normalize source timestamps for cross-run Siso continuation
          command: |
            set -euo pipefail
            SRC_DIR="$HOME/afterbird-chromium/src"
            test -d "$SRC_DIR"
            # The Chromium tag, dependency revisions and Afterbird patches are pinned.
            # Normalize input mtimes identically on each fresh runner so restoring the
            # prior output checkpoint does not make every source look newer than it.
            find "$SRC_DIR" \
              -path "$SRC_DIR/.git" -prune -o \
              -path "$SRC_DIR/out" -prune -o \
              -type f -exec touch -h -d '@946684800' {} +
            echo "=== Stable source timestamps applied ==="
            stat -c '%y %n' "$SRC_DIR/build/config/compiler/compiler.gni"

      - run:
          name: Prepare release GN arguments without touching checkpoint
          command: |
            set -eux
            export PATH="$HOME/depot_tools:$PATH"
            WORKDIR="$HOME/afterbird-chromium"
            SRC_DIR="$WORKDIR/src"
            ARGS_FILE="$CIRCLE_WORKING_DIRECTORY/sandfox-release-args.gn"

            cp "$HOME/afterbird-delta/.build/args/release.gn" "$ARGS_FILE"
            printf '\nuse_remoteexec = true\nuse_siso = true\n' >> "$ARGS_FILE"

            echo "=== REMOTE GN ARGS TO APPLY AFTER RESTORE ==="
            grep -E '^(use_remoteexec|use_siso) = ' "$ARGS_FILE"

            echo "=== SISO CACHE CONFIG DIAGNOSTICS ==="
            SISO_CONFIG_DIR="$SRC_DIR/build/config/siso"
            for FILE in "$SISO_CONFIG_DIR/.sisorc" "$SISO_CONFIG_DIR/.sisoenv"; do
              if [ -f "$FILE" ]; then
                echo "--- $FILE ---"
                if [ "$(basename "$FILE")" = ".sisorc" ]; then
                  cat "$FILE"
                else
                  grep -E '^(SISO_REAPI_ADDRESS|SISO_REAPI_INSTANCE|SISO_CREDENTIAL_HELPER)=' "$FILE" || true
                fi
              else
                echo "MISSING: $FILE"
              fi
            done
            echo "=== SISO EXECUTABLE VERSION ==="
            if command -v siso >/dev/null 2>&1; then
              siso version 2>&1 || siso --version 2>&1 || true
              command -v siso
            else
              find "$SRC_DIR/buildtools" -maxdepth 4 -type f -name siso -print 2>/dev/null | head -n 10
            fi

      - restore_cache:
          name: Restore prior compiled output and Siso filesystem state
          keys:
            - sandfox-aerium-v1-{{ .Branch }}-

      - run:
          name: Validate restored checkpoint before GN generation
          command: |
            set -euo pipefail
            export PATH="$HOME/depot_tools:$PATH"
            SRC_DIR="$HOME/afterbird-chromium/src"
            OUT_DIR="$SRC_DIR/out/afterbird_production"
            DELTA_DIR="$HOME/afterbird-delta"
            ARGS_FILE="$CIRCLE_WORKING_DIRECTORY/sandfox-release-args.gn"
            MARKER="$OUT_DIR/.sandfox-checkpoint-identity"

            checkpoint_identity() {
              {
                printf '%s\n' 'chromium_tag=151.0.7922.38'
                printf '%s\n' 'afterbird_sha=5ff224f9ef8f8a0792abd2babc9f7164e8dcdb3e'
                sha256sum "$DELTA_DIR/.build/args/release.gn"
                sha256sum "$SRC_DIR/build/config/compiler/compiler.gni"
                sha256sum "$SRC_DIR/build/config/siso/.sisorc"
                sha256sum "$SRC_DIR/build/config/siso/backend_config/backend.star"
                find "$CIRCLE_WORKING_DIRECTORY/patches/m151" -type f -name '*.patch' -print0 | sort -z | xargs -0 sha256sum
                find "$CIRCLE_WORKING_DIRECTORY/chrome/android/java/res_chromium_base" -type f -print0 | sort -z | xargs -0 sha256sum
              } | sha256sum | awk '{print $1}'
            }

            EXPECTED="$(checkpoint_identity)"
            REGENERATE=0
            if [ -f "$MARKER" ]; then
              ACTUAL="$(cat "$MARKER")"
              if [ "$ACTUAL" != "$EXPECTED" ]; then
                echo "Checkpoint identity mismatch; discarding stale output state."
                REGENERATE=1
              elif [ ! -f "$OUT_DIR/args.gn" ] || ! cmp -s "$ARGS_FILE" "$OUT_DIR/args.gn"; then
                echo "Restored args.gn does not match pinned release configuration; rebuilding GN state."
                REGENERATE=1
              elif [ ! -f "$OUT_DIR/build.ninja" ] || [ ! -f "$OUT_DIR/.siso_fs_state" ]; then
                echo "Checkpoint is missing required Ninja/Siso state; rebuilding GN state."
                REGENERATE=1
              else
                echo "Checkpoint identity and GN arguments verified; preserving restored Ninja/Siso state."
              fi
            else
              echo "No valid checkpoint marker; generating initial GN state after restore."
              REGENERATE=1
            fi

            if [ "$REGENERATE" -eq 1 ]; then
              rm -rf "$OUT_DIR"
              mkdir -p "$OUT_DIR"
              cp "$ARGS_FILE" "$OUT_DIR/args.gn"
              cd "$SRC_DIR"
              gn gen "$OUT_DIR"
              printf '%s\n' "$EXPECTED" > "$MARKER"
            fi

            echo "checkpoint_identity=$EXPECTED"
            echo "=== Restored checkpoint state ==="
            du -sh "$OUT_DIR"
            stat -c '%y %s %n' "$OUT_DIR/build.ninja" "$OUT_DIR/.siso_fs_state" "$OUT_DIR/.siso_deps" 2>/dev/null || true

      - run:
          name: Raise Siso local generator action pool to eight
          command: |
            set -euo pipefail
            OUT_DIR="$HOME/afterbird-chromium/src/out/afterbird_production"
            BUILD_NINJA="$OUT_DIR/build.ninja"
            test -s "$BUILD_NINJA"

            # Earlier Siso logs showed long queues on action/4. Raise the generated
            # pool to eight; SISO_LIMITS=local=8 applies the same upper bound.
            python3 -c '
            import pathlib, re, sys
            path = pathlib.Path(sys.argv[1])
            text = path.read_text()
            pattern = re.compile(r"(?m)^pool build_toolchain_action_pool\\n[ \\t]+depth = ([0-9]+)$")
            matches = list(pattern.finditer(text))
            if len(matches) != 1:
                raise SystemExit("Expected exactly one build_toolchain_action_pool definition; found " + str(len(matches)))
            current = int(matches[0].group(1))
            if current < 8:
                text, changed = pattern.subn("pool build_toolchain_action_pool\\n  depth = 8", text, count=1)
                if changed != 1:
                    raise SystemExit("Failed to update build_toolchain_action_pool depth")
                path.write_text(text)
            print("build_toolchain_action_pool depth:", current, "->", max(current, 8))
            ' "$BUILD_NINJA"
            grep -A 1 '^pool build_toolchain_action_pool$' "$BUILD_NINJA"

      - run:
          name: Validate Chromium Android APK target
          command: |
            set -eux
            export PATH="$HOME/depot_tools:$PATH"
            SRC_DIR="$HOME/afterbird-chromium/src"
            OUT_DIR="$SRC_DIR/out/afterbird_production"
            export PATH="$SRC_DIR/buildtools/linux64:$PATH"
            cd "$SRC_DIR"

            # Validate only the requested target. Walking every transitive dependency
            # costs nearly six minutes and the actual build will validate the graph.
            gn desc "$OUT_DIR" //chrome/android:chrome_public_apk type

            echo "=== APK TARGET VALIDATION PASSED ==="
            echo "=== DISK ==="
            df -hT
            echo "=== RAM ==="
            free -h
            echo "=== SOURCE SIZE ==="
            du -sh "$SRC_DIR"
            echo "=== WORKSPACE SIZE ==="
            du -sh "$HOME/afterbird-chromium"
            echo "=== GN OUTPUT SIZE ==="
            du -sh "$OUT_DIR"
            echo "=== GIT SIZE ==="
            du -sh "$SRC_DIR/.git"
            echo "=== REVISION ==="
            git -C "$SRC_DIR" rev-parse HEAD
            echo "=== TAG ==="
            git -C "$SRC_DIR" describe --tags --exact-match
            echo "=== PATCH STATUS ==="
            git -C "$SRC_DIR" status --short

      - run:
          name: Build exact Afterbird APK through Siso BuildBuddy
          command: |
            set -uo pipefail
            export PATH="$HOME/depot_tools:$PATH"
            SRC_DIR="$HOME/afterbird-chromium/src"
            OUT_DIR="$SRC_DIR/out/afterbird_production"
            LOG_FILE="$CIRCLE_WORKING_DIRECTORY/sandfox-remote-build.log"
            STATUS_FILE="$CIRCLE_WORKING_DIRECTORY/.sandfox-build-status"
            export PATH="$SRC_DIR/buildtools/linux64:$PATH"
            cd "$SRC_DIR"

            echo "=== REMOTE BUILD PRE-BUILD DISK ==="
            df -hT
            echo "=== REMOTE BUILD PRE-BUILD RAM ==="
            free -h
            echo "=== REMOTE BUILD START ==="

            # Siso exposes local and remote execution limits separately. BuildBuddy
            # Personal advertises up to 80 remote cores, so test that bounded ceiling.
            export SISO_LIMITS=local=8,remote=80

            # Stop before CircleCI's hard deadline so checkpoint compression/upload
            # and diagnostics have time to complete. The full graph walk was removed above.
            if timeout --signal=INT --kill-after=30s 35m bash -c 'set -o pipefail; autoninja -C "$1" -j80 chrome_public_apk 2>&1 | tee "$2"' _ "$OUT_DIR" "$LOG_FILE"; then
              BUILD_STATUS=0
            else
              BUILD_STATUS=$?
            fi

            if [ -f "$OUT_DIR/apks/ChromePublic.apk" ]; then
              mkdir -p "$CIRCLE_WORKING_DIRECTORY/afterbird-remote"
              if cp "$OUT_DIR/apks/ChromePublic.apk" "$CIRCLE_WORKING_DIRECTORY/afterbird-remote/ChromePublic.apk"; then
                # Also accept a completed APK if the timeout raced with final packaging.
                BUILD_STATUS=0
              else
                BUILD_STATUS=$?
              fi
            elif [ "$BUILD_STATUS" -eq 0 ]; then
              echo "Build returned success but ChromePublic.apk is missing."
              BUILD_STATUS=1
            fi

            echo "=== REMOTE BUILD EXIT STATUS: $BUILD_STATUS ==="
            echo "=== REMOTE EXECUTION COUNTS ==="
            grep -E 'noexec:[0-9]+ local:[0-9]+ remote:[0-9]+ cache:[0-9]+ skip:[0-9]+' "$LOG_FILE" || true
            echo "=== REMOTE BUILD POST-BUILD DISK ==="
            df -hT || true
            echo "=== REMOTE BUILD POST-BUILD RAM ==="
            free -h || true

            printf '%s\n' "$BUILD_STATUS" > "$STATUS_FILE"
            echo "Build status recorded; allowing checkpoint save and diagnostics to run."
            # Intentionally return success here. A final step reports BUILD_STATUS
            # only after the resumable output cache and diagnostics have been handled.
            exit 0
          teardown:
            - save_cache:
                name: Save resumable Siso checkpoint on failure or cancellation
                key: sandfox-aerium-v1-{{ .Branch }}-{{ .BuildNum }}
                paths:
                  - /home/circleci/afterbird-chromium/src/out/afterbird_production



      - run:
          name: Capture Siso failure diagnostics
          when: always
          command: |
            set +e
            SRC_DIR="$HOME/afterbird-chromium/src"
            OUT_DIR="$SRC_DIR/out/afterbird_production"
            DIAG_DIR="$CIRCLE_WORKING_DIRECTORY/siso-diagnostics"
            mkdir -p "$DIAG_DIR"

            if [ -f "$OUT_DIR/siso_failed_commands.sh" ]; then
              cp "$OUT_DIR/siso_failed_commands.sh" "$DIAG_DIR/"
            fi
            if [ -f "$OUT_DIR/siso.INFO" ]; then
              tail -n 5000 "$OUT_DIR/siso.INFO" > "$DIAG_DIR/siso.INFO.tail.txt"
            fi
            if [ -d "$OUT_DIR/siso_output" ]; then
              du -sh "$OUT_DIR/siso_output" > "$DIAG_DIR/siso_output.size.txt"
              find "$OUT_DIR/siso_output" -maxdepth 3 -type f -printf '%T@ %s %p\n' | sort -nr | head -n 300 > "$DIAG_DIR/siso_output.files.txt"
              SIZE_MB="$(du -sm "$OUT_DIR/siso_output" | cut -f1)"
              if [ "$SIZE_MB" -le 250 ]; then
                tar -czf "$DIAG_DIR/siso_output.tar.gz" -C "$OUT_DIR" siso_output
              else
                echo "siso_output exceeds 250 MiB; listing only to avoid a huge artifact." >> "$DIAG_DIR/siso_output.size.txt"
              fi
            fi
            echo "=== Captured diagnostic files ==="
            find "$DIAG_DIR" -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

      - store_artifacts:
          path: siso-diagnostics
          destination: siso-diagnostics

      - store_artifacts:
          path: afterbird-remote/ChromePublic.apk
          destination: afterbird-remote/ChromePublic.apk

      - store_artifacts:
          path: sandfox-remote-build.log
          destination: afterbird-remote/sandfox-remote-build.log

      - run:
          name: Report build result after checkpoint save
          when: always
          command: |
            set -eu
            STATUS_FILE="$CIRCLE_WORKING_DIRECTORY/.sandfox-build-status"
            if [ ! -f "$STATUS_FILE" ]; then
              echo "Build status file is missing; build result cannot be verified."
              exit 1
            fi
            BUILD_STATUS="$(cat "$STATUS_FILE")"
            if [ "$BUILD_STATUS" -ne 0 ]; then
              echo "Reporting original build failure after checkpoint-save attempt: exit $BUILD_STATUS"
              exit "$BUILD_STATUS"
            fi
            echo "Build completed successfully and checkpoint-save step was reached."

workflows:
  c4-afterbird-buildbuddy-remote:
    jobs:
      - c4-afterbird-buildbuddy-remote
