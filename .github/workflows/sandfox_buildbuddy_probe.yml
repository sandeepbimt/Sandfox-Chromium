name: SANDFOX BuildBuddy Remote Runner Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  buildbuddy-remote-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe BuildBuddy remote runner
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          test -n "${BUILDBUDDY_API_KEY}" || {
            echo "BUILDBUDDY_API_KEY GitHub secret is missing."
            exit 1
          }

          RESPONSE="$(
            curl --fail-with-body -sS               -H "x-buildbuddy-api-key: ${BUILDBUDDY_API_KEY}"               -H "Content-Type: application/json"               -d '{
                "repo": "https://github.com/sandeepbimt/Sandfox-Chromium.git",
                "branch": "afterbird",
                "steps": [
                  {
                    "run": "set -eu; echo \"=== SANDFOX BUILDBUDDY REMOTE RUNNER ===\"; echo \"CPU:\"; nproc; echo \"MEMORY:\"; free -h; echo \"DISK:\"; df -h /; echo \"OS:\"; cat /etc/os-release; echo \"=== REMOTE RUNNER PROBE COMPLETE ===\""
                  }
                ],
                "wait_until": "COMPLETED"
              }'               https://app.buildbuddy.io/api/v1/Run
          )"

          echo "Run response:"
          echo "${RESPONSE}"

          INVOCATION_ID="$(printf '%s' "${RESPONSE}" | jq -r '.invocationId')"
          test -n "${INVOCATION_ID}" && test "${INVOCATION_ID}" != "null"

          echo "Invocation: ${INVOCATION_ID}"

          echo "=== INVOCATION STATUS ==="
          curl --fail-with-body -sS             -H "x-buildbuddy-api-key: ${BUILDBUDDY_API_KEY}"             -H "Content-Type: application/json"             -d "{"selector":{"invocation_id":"${INVOCATION_ID}"}}"             https://app.buildbuddy.io/api/v1/GetInvocation

          echo
          echo "=== REMOTE LOG ==="
          curl --fail-with-body -sS             -H "x-buildbuddy-api-key: ${BUILDBUDDY_API_KEY}"             -H "Content-Type: application/json"             -d "{"selector":{"invocation_id":"${INVOCATION_ID}"}}"             https://app.buildbuddy.io/api/v1/GetLog
