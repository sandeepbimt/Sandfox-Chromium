name: SANDFOX Chromium GN Graph Smoke

on:
  workflow_dispatch:
    inputs:
      compile_probe:
        description: "After GN succeeds, compile one real Chromium object and require remote execution"
        required: true
        default: false
        type: boolean
      compile_jobs:
        description: "Maximum Ninja jobs for the optional compile probe (use 1 first; then test 2 or 4)"
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
          - "4"

permissions:
  contents: read

jobs:
  gn-graph-smoke:
    name: Chromium M151 dependency sync + GN target graph
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout SANDFOX
        uses: actions/checkout@v4

      - name: Run bounded GN smoke test
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
          RUNNER_TEMP: ${{ runner.temp }}
          SANDFOX_COMPILE_PROBE: ${{ inputs.compile_probe }}
          SANDFOX_COMPILE_JOBS: ${{ inputs.compile_jobs }}
        shell: bash
        run: |
          set -euo pipefail
          LOG_FILE="${RUNNER_TEMP}/sandfox-gn-smoke.log"
          mkdir -p "${RUNNER_TEMP}"
          touch "${LOG_FILE}"
          exec > >(tee -a "${LOG_FILE}") 2>&1

          resource_snapshot() {
            local label="$1"
            local chromium_src="${AFTERBIRD_CHROMIUM_WORKDIR:-${RUNNER_TEMP}/afterbird-chromium}/src"
            local out_dir="${chromium_src}/out/afterbird_production"
            echo "=== RESOURCE SNAPSHOT: ${label} ==="
            date -u '+timestamp_utc=%Y-%m-%dT%H:%M:%SZ'
            df -h /
            df -PB1 /
            if [[ -r /proc/meminfo ]]; then
              grep -E '^(MemTotal|MemAvailable|SwapTotal|SwapFree):' /proc/meminfo
            fi
            if [[ -d "${chromium_src}" ]]; then
              du -sh "${chromium_src}"
            else
              echo "Chromium source tree not present yet."
            fi
            if [[ -d "${out_dir}" ]]; then
              du -sh "${out_dir}"
              find "${out_dir}" -maxdepth 2 -type f -name 'siso*' -exec du -sh {} + 2>/dev/null || true
              find "${out_dir}" -maxdepth 2 -type f -name '.siso_fs_state.journal' -exec du -sh {} + 2>/dev/null || true
            else
              echo "GN output directory not present yet."
            fi
          }

          echo "=== SANDFOX GN GRAPH SMOKE: PREFLIGHT ==="
          df -h /
          FREE_BYTES="$(df -PB1 / | awk 'NR == 2 {print $4}')"
          MIN_FREE_BYTES=$((40 * 1024 * 1024 * 1024))
          echo "Free disk bytes: ${FREE_BYTES}; required before sync: ${MIN_FREE_BYTES}"
          if [[ "${FREE_BYTES}" -lt "${MIN_FREE_BYTES}" ]]; then
            echo "STOP: less than 40 GiB free. Chromium dependency sync was not started."
            exit 78
          fi

          DEPOT_TOOLS_DIR="${RUNNER_TEMP}/depot_tools"
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "${DEPOT_TOOLS_DIR}"
          export PATH="${DEPOT_TOOLS_DIR}:${PATH}"
          export DEPOT_TOOLS_UPDATE=0

          # DEPOT_TOOLS_UPDATE=0 prevents implicit bootstrap; initialize the
          # checkout explicitly before invoking the Chromium GN wrapper.
          "${DEPOT_TOOLS_DIR}/ensure_bootstrap"
          command -v gclient
          command -v gn
          command -v rsync

          export AFTERBIRD_CHROMIUM_WORKDIR="${RUNNER_TEMP}/afterbird-chromium"
          export AFTERBIRD_REMOTE_EXEC=1
          # Avoid repeating an expensive full dependency sync in the same job.
          export AFTERBIRD_GCLIENT_RETRIES=1
          export AFTERBIRD_FETCH_RETRIES=2

          echo "=== RUNNING PRODUCTION PIPELINE SMOKE PATH (NO APK COMPILE) ==="
          resource_snapshot "before_dependency_sync_and_gn"
          PIPELINE_START="$(date +%s)"
          if bash ci/chromium_android_pipeline.sh; then
            PIPELINE_STATUS=0
          else
            PIPELINE_STATUS=$?
          fi
          PIPELINE_ELAPSED="$(( $(date +%s) - PIPELINE_START ))"
          echo "pipeline_elapsed_seconds=${PIPELINE_ELAPSED}"
          resource_snapshot "after_dependency_sync_and_gn"
          if [[ "${PIPELINE_STATUS}" -ne 0 ]]; then
            echo "ERROR: production pipeline smoke path failed with exit code ${PIPELINE_STATUS}."
            exit "${PIPELINE_STATUS}"
          fi

          if [[ "${SANDFOX_COMPILE_PROBE}" == "true" ]]; then
            CHROMIUM_SRC="${AFTERBIRD_CHROMIUM_WORKDIR}/src"
            OUT_DIR="${CHROMIUM_SRC}/out/afterbird_production"
            COMPILE_LOG="${RUNNER_TEMP}/sandfox-remote-compile-probe.log"
            echo "=== SELECT ONE GENERATED CHROMIUM OBJECT TARGET ==="
            OBJECT_TARGET="$(ninja -C "${OUT_DIR}" -t targets all | awk -F': ' '$1 ~ /^obj[/].*[.]o$/ && !found { print $1; found=1 }')"
            if [[ -z "${OBJECT_TARGET}" ]]; then
              echo "ERROR: GN generated no object-file targets to probe."
              exit 1
            fi
            echo "Selected object target: ${OBJECT_TARGET}"
            echo "=== COMPILE ONE REAL OBJECT THROUGH THE PRODUCTION SISO CONFIG ==="
            if [[ "${SANDFOX_COMPILE_JOBS}" != "1" && "${SANDFOX_COMPILE_JOBS}" != "2" && "${SANDFOX_COMPILE_JOBS}" != "4" ]]; then
              echo "ERROR: compile_jobs must be 1, 2, or 4."
              exit 1
            fi
            echo "Compile probe job limit: ${SANDFOX_COMPILE_JOBS}"
            set -o pipefail
            # Force cache misses for this bounded probe so remote execution is measured,
            # not inferred from shared-cache hits. Strict remote prevents local execution
            # of actions that Siso has configured for remote execution.
            COMPILE_START="$(date +%s)"
            autoninja -C "${OUT_DIR}" -j "${SANDFOX_COMPILE_JOBS}" -re_cache_enable_read=false --strict_remote "${OBJECT_TARGET}" 2>&1 | tee "${COMPILE_LOG}"
            COMPILE_ELAPSED="$(( $(date +%s) - COMPILE_START ))"
            echo "compile_probe_elapsed_seconds=${COMPILE_ELAPSED}"
            resource_snapshot "after_compile_probe"
            echo "=== REQUIRE A FRESH REMOTE EXECUTION ==="
            grep -E 'remote:[1-9][0-9]*' "${COMPILE_LOG}"
            echo "=== SANDFOX REAL CHROMIUM REMOTE OBJECT COMPILE CONFIRMED ==="
          else
            echo "Compile probe disabled; GN graph only."
          fi

          echo "=== GN GRAPH SMOKE PASSED ==="
          echo "Verified: pinned Chromium checkout, dependency sync, SANDFOX patches, upstream Siso/BuildBuddy configuration, gn gen, and chrome_public_apk dependency graph."
          echo "Full APK compilation was intentionally not requested."

      - name: Preserve diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandfox-gn-graph-smoke-log
          path: |
            ${{ runner.temp }}/sandfox-gn-smoke.log
            ${{ runner.temp }}/afterbird-chromium/src/out/afterbird_production/siso_output
            ${{ runner.temp }}/afterbird-chromium/src/out/afterbird_production/siso.INFO
            ${{ runner.temp }}/afterbird-chromium/src/out/afterbird_production/siso_failed_commands.sh
          if-no-files-found: warn
          retention-days: 7
